# ~/.tmux.conf

# --- Truecolor (needed so Neovim's gruvbox colors look right inside tmux) ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"

# --- Basics ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g status-interval 5
set -g history-limit 50000

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 60

# Left: session name (green normally, orange while the prefix key is active)
set -g status-left "#{?client_prefix,#[bg=#fe8019],#[bg=#b8bb26]}#[fg=#282828,bold] #S #{?client_prefix,#[fg=#fe8019],#[fg=#b8bb26]}#[bg=#3c3836,nobold] "

# Right: time and hostname
set -g status-right "#[fg=#504945,bg=#3c3836]#[fg=#ebdbb2,bg=#504945] %H:%M #[fg=#a89984,bg=#504945]#[fg=#282828,bg=#a89984,bold] #H "

# Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#a89984,bg=#3c3836] #I #W "
set -g window-status-current-format "#[fg=#3c3836,bg=#fabd2f]#[fg=#282828,bg=#fabd2f,bold] #I #W #[fg=#fabd2f,bg=#3c3836,nobold]"
set -g window-status-activity-style "fg=#fb4934"
set -g window-status-bell-style "fg=#fb4934,bold"

# --- Panes ---
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g display-panes-colour "#504945"
set -g display-panes-active-colour "#fabd2f"

# --- Messages, copy mode, clock ---
set -g message-style "bg=#fabd2f,fg=#282828"
set -g message-command-style "bg=#fabd2f,fg=#282828"
set -g mode-style "bg=#fabd2f,fg=#282828"
setw -g clock-mode-colour "#fabd2f"

# --- Reload with prefix + r ---
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

