# ============================================================
# MINIMAL BLACK TMUX
# Pure Black | Gray | Minimal | No Bold
# ============================================================

# TRUE COLOR
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"

# BASIC SETTINGS
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g status-interval 5
set -g history-limit 50000
set -g allow-rename off

# STATUS BAR
set -g status on
set -g status-position top
set -g status-justify left

set -g status-style "bg=#a69d8f,fg=#202020"
set -g status-left-length 40
set -g status-right-length 60

# LEFT
set -g status-left "#[nobold,noitalics] #S "

# RIGHT
set -g status-right "#[fg=#55514b] %H:%M #[fg=#202020] #H "

# WINDOWS
set -g window-status-separator ""

set -g window-status-format \
    "#[bg=#a69d8f,fg=#514d47,nobold,noitalics] #I:#W "

set -g window-status-current-format \
    "#[bg=#202020,fg=#eeeeee,nobold,noitalics] #I:#W "

set -g window-status-activity-style \
    "fg=#777777,bg=#a69d8f,nobold,noitalics"

set -g window-status-bell-style \
    "fg=#aaaaaa,bg=#202020,nobold,noitalics"

# PANES
set -g pane-border-style "fg=#242424"
set -g pane-active-border-style "fg=#555555"

set -g display-panes-colour "#555555"
set -g display-panes-active-colour "#aaaaaa"

set -g pane-border-lines single

# MESSAGES
set -g message-style \
    "bg=#333333,fg=#eeeeee,nobold,noitalics"

set -g message-command-style \
    "bg=#333333,fg=#eeeeee,nobold,noitalics"

# COPY MODE
set -g mode-style \
    "bg=#444444,fg=#eeeeee,nobold,noitalics"

# CLOCK
setw -g clock-mode-colour "#aaaaaa"

# WINDOW BACKGROUND
set -g window-style "bg=#000000"
set -g window-active-style "bg=#000000"

# RELOAD
bind r source-file ~/.tmux.conf \; \
    display-message "Reloaded ~/.tmux.conf"

# ============================================================
# END
# ============================================================
