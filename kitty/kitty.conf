# ~/.config/kitty/kitty.conf
# FiraCode Nerd Font Mono + dark theme, tuned for smooth, fast, no animation

# ---------- Font ----------
# BEGIN_KITTY_FONTS
font_family      family='Fira Code' postscript_name=FiraCode-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size        12
disable_ligatures never
modify_font      line_height 105%

# ---------- Performance ----------
repaint_delay           6
input_delay             1
sync_to_monitor         yes
resize_debounce_time    0.05 0.05

# ---------- Keys ----------
# Fullscreen / maximize
map f11              toggle_fullscreen
map ctrl+shift+f11   toggle_maximized

# Easy tab navigation
map ctrl+alt+left    previous_tab
map ctrl+alt+right   next_tab

# ---------- Cursor animation (off) ----------
#cursor_trail                  3
#cursor_trail_decay            0.1 0.4
#cursor_trail_start_threshold  2
#cursor_shape                  block
#cursor_blink_interval         0.5 ease-in-out

# ---------- Shell ----------
shell /usr/bin/zsh

