# ~/.config/kitty/kitty.conf
# Iosevka Nerd Font Mono + Dark Gray / Catppuccin Mocha accents
# Tuned for smooth, fast, no animation

# ---------- Font ----------
font_family      Iosevka Nerd Font Mono
font_size        12
disable_ligatures never
modify_font line_height 105%

# ---------- Performance ----------
repaint_delay           6
input_delay             1
sync_to_monitor         yes
resize_debounce_time    0.05 0.05

# ---------- Window & Top Bar ----------
# Option A (active): keep the title bar but blend it into the terminal
hide_window_decorations   no
wayland_titlebar_color    background
# Option B: remove the title bar completely (comment out the two lines above)
# hide_window_decorations yes

background_opacity        0.96
background_blur           1
window_padding_width      0
window_margin_width       0
remember_window_size      no
initial_window_width      200c
initial_window_height     50c
confirm_os_window_close   0
inactive_text_alpha       0.7
draw_minimal_borders      yes
window_border_width       1pt

# ---------- Cursor (no blink, no trail) ----------
cursor_shape                beam
cursor_beam_thickness       1.5
cursor_blink_interval       0
cursor_trail                0

# ---------- Tab bar ----------
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      round
tab_bar_min_tabs         2
tab_bar_margin_height    4.0 0.0
tab_title_max_length     28
tab_title_template       " {index}: {title} "
active_tab_title_template " {index}: {title}{' 󰈸' if layout_name == 'stack' else ''} "
active_tab_font_style    bold
inactive_tab_font_style  normal
tab_activity_symbol      " 󰂚"
bell_on_tab              "🔔 "

# ---------- Scrollback & Mouse Controls ----------
scrollback_lines        20000
copy_on_select          clipboard
mouse_hide_wait         3.0
url_style               curly
open_url_with           default
detect_urls             yes
enable_audio_bell       no
visual_bell_duration    0.0
visual_bell_color       none
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# Scroll wheel on tab bar to switch tabs
map shift+scroll_up   previous_tab
map shift+scroll_down next_tab

# ---------- Shell Integration ----------
shell_integration       enabled
allow_remote_control    socket-only
listen_on               unix:/tmp/kitty-{kitty_pid}

# ---------- Layouts ----------
enabled_layouts         splits,stack,tall:bias=60

# ---------- Dark Gray & Catppuccin Mocha Colors ----------
background            #262626
foreground            #d4d4d4
cursor                #f5c2e7
cursor_text_color     #262626
selection_background  #4a4a4a
selection_foreground  #ffffff
url_color             #89B4FA

active_border_color   #89B4FA
inactive_border_color #3a3a3a
bell_border_color     #F9E2AF

# Marks (search highlights)
mark1_foreground #262626
mark1_background #F9E2AF
mark2_foreground #262626
mark2_background #F5C2E7
mark3_foreground #262626
mark3_background #94E2D5

# Tab bar colors
tab_bar_background          #1c1c1c
active_tab_foreground       #262626
active_tab_background       #89B4FA
inactive_tab_foreground     #a0a0a0
inactive_tab_background     #333333

# Terminal colors
color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8

# ---------- Shortcuts ----------
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+f5    load_config_file

# Fullscreen / maximize
map f11              toggle_fullscreen
map ctrl+shift+f11   toggle_maximized

# Easy tab navigation
map ctrl+alt+left   previous_tab
map ctrl+alt+right  next_tab

